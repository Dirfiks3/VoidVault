name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload bundles to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VoidVault ${{ github.ref_name }}"
          releaseBody: |
            Сборки выполнены GitHub Actions из исходного кода этого тега.
            Хэши и аттестации происхождения прикреплены к релизу отдельно.
          releaseDraft: true
          prerelease: false

      - name: Collect bundle paths and checksums
        shell: bash
        id: bundles
        run: |
          cd src-tauri/target/release/bundle
          {
            echo 'paths<<EOF'
            find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) -print0 \
            | sort -z | xargs -0 sha256sum > "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Attest that the bundles were built from this commit
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.bundles.outputs.paths }}

      - name: Attach checksums to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/release/bundle/SHA256SUMS-${{ matrix.platform }}.txt" --clobber
